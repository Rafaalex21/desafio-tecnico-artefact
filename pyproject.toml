[project]
name = "emporio-da-musica-agente"
version = "0.1.0"
description = "Agente de atendimento da loja fictícia Empório da Música, com LLM local e function calling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "rapidfuzz",
    "pymupdf4llm",
    "rich",
    "pyyaml",
    "tzdata",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pytest",
    "pytest-html>=4.2.0",
    "pytest-json-report>=1.5.0",
    "pytest-playwright>=0.10.0",
    "ruff",
]

[project.scripts]
emporio-etl = "emporio.etl.__main__:main"
emporio-chat = "emporio.cli:main"
emporio-web = "emporio.web.app:main"
emporio-evals = "emporio.evals.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::pytest.PytestUnhandledThreadExceptionWarning"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: fluxos da tela de chat com navegador real (rodar com -m e2e)",
    "real: usa o modelo local de verdade (exige E2E_MODELO_REAL=1)",
]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/painel_payload.py" = ["E501"]
